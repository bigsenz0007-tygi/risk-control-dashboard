<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>风险监控看板</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f5f5f5; color: #1b1b1b; font-family: "PingFang SC", -apple-system, "Microsoft YaHei", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
.range { font-size: 13px; color: #6a6a6a; line-height: 1.6; }
.note { font-size: 12px; color: #9d9d9d; margin: 4px 0 20px; }
.cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 22px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.card-pending { background: #fafafa; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-label { font-size: 14px; color: #6a6a6a; }
.card-value { font-size: 24px; font-weight: 600; margin-top: 8px; }
.card-sub { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9d9d9d; margin-top: 6px; }
.card-sub b { color: #1b1b1b; font-weight: 500; }
.muted { color: #d1d5db !important; }
.tag { font-size: 10px; line-height: 18px; padding: 0 4px; border-radius: 2px; }
.tag-blue { background: rgba(59,130,246,.1); color: #3B82F6; }
.tag-gray { background: #f5f5f5; color: #9ca3af; }
.panels { display: grid; grid-template-columns: 2fr 3fr; gap: 22px; }
.panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 16px 24px 24px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #9d9d9d; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
.legend i.dash { height: 0; border-top: 2px dashed; border-color: inherit; background: none !important; }
.empty { color: #9d9d9d; font-size: 13px; text-align: center; padding: 40px 0; }
@media (max-width: 900px){ .cards{ grid-template-columns: repeat(2,1fr);} .panels{ grid-template-columns: 1fr;} }
</style>
</head>
<body>

  <div class="panels">

        <text x="378" y="310" text-anchor="start" fill="#c4c8d0" font-size="10">转化率</text>
        <text x="378" y="326" text-anchor="start" fill="#c4c8d0" font-size="12">待上线</text>
      </svg></div>

          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
          <line x1="50" y1="40" x2="550" y2="40" stroke="#f0f1f2" stroke-width="1" stroke-dasharray="4"></line>

          <text x="40" y="99" text-anchor="end" fill="#9d9d9d" font-size="10">113w</text>
          <text x="560" y="99" text-anchor="start" fill="#9d9d9d" font-size="10">75%</text><line x1="50" y1="150" x2="550" y2="150" stroke="#f0f1f2" stroke-width="1" stroke-dasharray="4"></line>
          <text x="40" y="154" text-anchor="end" fill="#9d9d9d" font-size="10">75w</text>
          <text x="560" y="154" text-anchor="start" fill="#9d9d9d" font-size="10">50%</text><line x1="50" y1="205" x2="550" y2="205" stroke="#f0f1f2" stroke-width="1" stroke-dasharray="4"></line>
          <text x="40" y="209" text-anchor="end" fill="#9d9d9d" font-size="10">38w</text>
          <text x="560" y="209" text-anchor="start" fill="#9d9d9d" font-size="10">25%</text><line x1="50" y1="260" x2="550" y2="260" stroke="#f0f1f2" stroke-width="1" stroke-dasharray="4"></line>
          <text x="40" y="264" text-anchor="end" fill="#9d9d9d" font-size="10">0w</text>
          <text x="560" y="264" text-anchor="start" fill="#9d9d9d" font-size="10">0%</text>
          <text x="50" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-20</text><text x="133.33333333333331" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-21</text><text x="216.66666666666666" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-22</text><text x="300" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-23</text><text x="383.3333333333333" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-24</text><text x="466.6666666666667" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-25</text><text x="550" y="285" text-anchor="middle" fill="#9d9d9d" font-size="10">08-26</text>
          <path d="M50,93.11357333333333 L133.33333333333331,111.94557333333333 L216.66666666666666,99.51278666666667 L300,95.93074666666666 L383.3333333333333,112.70061333333334 L466.6666666666667,103.05287999999999 L550,102.95035999999999 L550,260 L50,260 Z" fill="url(#g)"></path>
          <path d="M50,93.11357333333333 L133.33333333333331,111.94557333333333 L216.66666666666666,99.51278666666667 L300,95.93074666666666 L383.3333333333333,112.70061333333334 L466.6666666666667,103.05287999999999 L550,102.95035999999999" fill="none" stroke="#3B82F6" stroke-width="2"></path>
          <path d="M50,247.67486666666667 L133.33333333333331,249.54882666666666 L216.66666666666666,248.78850666666668 L300,248.37124 L383.3333333333333,248.21958666666666 L466.6666666666667,248.42990666666668 L550,249.46170666666666" fill="none" stroke="#f63218" stroke-width="2"></path>
          <path d="M50,243.742 L133.33333333333331,244.468 L216.66666666666666,244.622 L300,244.402 L383.3333333333333,242.4 L466.6666666666667,243.786 L550,245.238" fill="none" stroke="#faad14" stroke-width="1.5" stroke-dasharray="4"></path>
          <line id="snapCross" y1="40" y2="260" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2" style="display:none;"></line>
          <circle id="snapDotCall" r="4" fill="#3B82F6" style="display:none;"></circle>

          <circle id="snapDotRate" r="3" fill="#faad14" style="display:none;"></circle>

        </div></div>
  </div>
</div>
<script>
(function(){
  var PTS=[{"time":"08-20","calls":1137862,"hits":84035,"hitRate":"7.39","x":50,"callY":93.11357333333333,"hitY":247.67486666666667,"rateY":243.742},{"time":"08-21","calls":1009462,"hits":71258,"hitRate":"7.06","x":133.33333333333331,"callY":111.94557333333333,"hitY":249.54882666666666,"rateY":244.468},{"time":"08-22","calls":1094231,"hits":76442,"hitRate":"6.99","x":216.66666666666666,"callY":99.51278666666667,"hitY":248.78850666666668,"rateY":244.622},{"time":"08-23","calls":1118654,"hits":79287,"hitRate":"7.09","x":300,"callY":95.93074666666666,"hitY":248.37124,"rateY":244.402},{"time":"08-24","calls":1004314,"hits":80321,"hitRate":"8.00","x":383.3333333333333,"callY":112.70061333333334,"hitY":248.21958666666666,"rateY":242.4},{"time":"08-25","calls":1070094,"hits":78887,"hitRate":"7.37","x":466.6666666666667,"callY":103.05287999999999,"hitY":248.42990666666668,"rateY":243.786},{"time":"08-26","calls":1070793,"hits":71852,"hitRate":"6.71","x":550,"callY":102.95035999999999,"hitY":249.46170666666666,"rateY":245.238}];
  var W=600,PL=50,CW=500;
  var svg=document.getElementById('snapTrendSvg');
  if(!svg)return;
  var cross=document.getElementById('snapCross');
  var dCall=document.getElementById('snapDotCall');
  var dHit=document.getElementById('snapDotHit');
  var dRate=document.getElementById('snapDotRate');
  var tip=document.getElementById('snapTip');
  function nf(n){return Number(n).toLocaleString();}
  function row(c,l,v){
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:6px;">'
      +'<span style="font-size:12px;color:#6a6a6a;display:inline-flex;align-items:center;gap:4px;">'
      +'<span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:'+c+';"></span>'
      +l+'</span>'
      +'<span style="font-size:12px;font-weight:700;font-family:monospace;">'+v+'</span></div>';
  }
  svg.addEventListener('mousemove',function(e){
    var r=svg.getBoundingClientRect();
    var x=((e.clientX-r.left)/r.width)*W;
    var i=Math.round(((x-PL)/CW)*(PTS.length-1));
    if(i<0)i=0; if(i>PTS.length-1)i=PTS.length-1;
    var p=PTS[i];
    cross.setAttribute('x1',p.x);cross.setAttribute('x2',p.x);cross.style.display='';
    dCall.setAttribute('cx',p.x);dCall.setAttribute('cy',p.callY);dCall.style.display='';
    dHit.setAttribute('cx',p.x);dHit.setAttribute('cy',p.hitY);dHit.style.display='';
    dRate.setAttribute('cx',p.x);dRate.setAttribute('cy',p.rateY);dRate.style.display='';
    tip.style.display='block';
    tip.style.left=((p.x/W)*r.width+20)+'px';
    tip.style.top='80px';
    tip.innerHTML='<div style="font-size:13px;font-weight:700;color:#1b1b1b;margin-bottom:8px;border-bottom:1px solid #f5f5f5;padding-bottom:4px;">'+p.time+' 监控数据</div>'
      +row('#3B82F6','调用量',nf(p.calls))
      +row('#f63218','命中量',nf(p.hits))
      +row('#faad14','命中率',p.hitRate+'%');
  });
  svg.addEventListener('mouseleave',function(){
    cross.style.display='none';dCall.style.display='none';dHit.style.display='none';dRate.style.display='none';tip.style.display='none';
  });
})();
</script>
</body>
</html>
